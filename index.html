<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    <style>
        :root {
            /* Palette */
            --bg-color: #101010;
            --surface-color: #202020;
            --text-primary: #ffffff;
            --text-secondary: #8a8a8a;
            --accent-color: #e0e0e0;
            --timer-color: #AFAFAF; /* Lower contrast for timer */
            
            /* Heatmap Colors */
            --grid-empty: #1a1a1a;
            --level-1: #0e4429; 
            --level-2: #006d32;
            --level-3: #26a641;
            --level-4: #39d353;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        /* Top Right Music Toggle */
        .music-toggle {
            position: absolute;
            top: 25px;
            right: 25px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: color 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .music-toggle:hover {
            color: var(--text-primary);
            background: var(--surface-color);
        }
        .music-toggle svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Timer Section */
        .timer-container { 
            text-align: center; 
            margin-bottom: 30px; /* Reduced slightly since internal margins increased */
        }

        .time-display {
            font-size: 7rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1;
            margin-top: 10px;
            margin-bottom: 40px; /* Increased padding to buttons */
            font-variant-numeric: tabular-nums;
            color: var(--timer-color); /* Updated Color */
        }

        .status-badge {
            background-color: var(--surface-color);
            color: var(--text-secondary);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            display: inline-block;
        }

        /* Controls */
        .controls { 
            display: flex; 
            gap: 12px; 
            justify-content: center; 
            margin-bottom: 30px; /* Standard gap */
        }

        button {
            background-color: var(--surface-color);
            color: var(--text-primary);
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover { background-color: #333333; transform: translateY(-1px); }

        button.primary {
            background-color: var(--accent-color);
            color: var(--bg-color);
            font-weight: 600;
        }

        button.primary:hover { background-color: #ffffff; opacity: 1; }

        /* Settings inputs */
        .settings {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px; /* Reduced from 50px to match controls gap */
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .settings label { display: flex; align-items: center; gap: 8px; }

        input {
            background: var(--surface-color);
            border: none;
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 8px;
            width: 40px;
            text-align: center;
            font-family: inherit;
            font-weight: 600;
        }
        
        input:focus { outline: 2px solid var(--accent-color); }

        /* Remove Spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }

        /* Heatmap Section */
        .heatmap-container {
            background-color: var(--surface-color);
            padding: 24px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .heatmap-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .months-container {
            position: relative;
            height: 15px;
            width: 100%;
            margin-bottom: 4px;
        }

        .month-label {
            position: absolute;
            font-size: 10px;
            color: var(--text-secondary);
        }

        .heatmap-grid {
            display: grid;
            grid-template-rows: repeat(7, 10px);
            grid-auto-flow: column;
            gap: 4px;
        }

        .day-cell {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            background-color: var(--grid-empty);
        }

        /* Heatmap Levels */
        .level-1 { background-color: var(--level-1); }
        .level-2 { background-color: var(--level-2); }
        .level-3 { background-color: var(--level-3); }
        .level-4 { background-color: var(--level-4); }

        .tooltip {
            margin-top: 15px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            height: 1em;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <button class="music-toggle" id="music-toggle" onclick="toggleMusicPrefs()" title="Toggle Alpha Waves (10Hz)">
        </button>

    <div class="timer-container">
        <div class="status-badge" id="status-text">Focus</div>
        <div class="time-display" id="timer">25:00</div>
        
        <div class="controls">
            <button class="primary" onclick="toggleTimer()" id="toggle-btn">Start</button>
            <button onclick="resetTimer()">Reset</button>
            <button onclick="switchMode()">Skip</button>
        </div>

        <div class="settings">
            <label>Focus <input type="number" id="focus-input" value="25" onchange="updateSettings()"></label>
            <label>Break <input type="number" id="break-input" value="5" onchange="updateSettings()"></label>
        </div>
    </div>

    <div class="heatmap-container">
        <div class="heatmap-wrapper">
            <div class="months-container" id="months-labels"></div>
            <div class="heatmap-grid" id="heatmap"></div>
        </div>
        <div class="tooltip" id="tooltip">Total study time today: 0m</div>
    </div>

    <script>
        // --- State ---
        let timeLeft = 25 * 60;
        let isRunning = false;
        let isFocusMode = true;
        let timerId = null;
        let musicEnabled = false; 
        
        // --- Audio Context ---
        let audioCtx;
        let leftOsc, rightOsc, gainNode;
        
        // --- Data Persistence ---
        const STORAGE_KEY = 'study_heatmap_data';
        let studyData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};

        // --- Elements ---
        const timerDisplay = document.getElementById('timer');
        const statusText = document.getElementById('status-text');
        const toggleBtn = document.getElementById('toggle-btn');
        const focusInput = document.getElementById('focus-input');
        const breakInput = document.getElementById('break-input');
        const musicToggleBtn = document.getElementById('music-toggle');

        // --- Icons ---
        const ICON_VOL_ON = `<svg viewBox="0 0 24 24"><path d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zm-4 0c-4.01.91-7 4.49-7 8.77s2.99 7.86 7 8.77v-2.06c-2.89-.86-5-3.54-5-6.71s2.11-5.85 5-6.71V3.23zM9 13.5h2.25l3 3V7.5l-3 3H9v3z"/></svg>`;
        const ICON_VOL_OFF = `<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>`;

        // --- Core Functions ---
        function updateDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            timerDisplay.textContent = `${m}:${s}`;
            document.title = `${m}:${s} - Focus Timer`;
        }

        function toggleTimer() {
            if (isRunning) {
                // Pause
                clearInterval(timerId);
                toggleBtn.textContent = "Start";
                toggleBtn.classList.add('primary');
                stopBinaural();
            } else {
                // Start
                initAudio();
                timerId = setInterval(tick, 1000);
                toggleBtn.textContent = "Pause";
                toggleBtn.classList.remove('primary');
                if (isFocusMode && musicEnabled) startBinaural();
            }
            isRunning = !isRunning;
        }

        function tick() {
            if (timeLeft > 0) {
                timeLeft--;
                updateDisplay();
                if (isFocusMode && timeLeft % 60 === 0) {
                    logMinute();
                }
            } else {
                playNotificationSound();
                switchMode();
            }
        }

        function switchMode() {
            clearInterval(timerId);
            isRunning = false;
            stopBinaural();

            toggleBtn.textContent = "Start";
            toggleBtn.classList.add('primary');
            
            isFocusMode = !isFocusMode;
            statusText.textContent = isFocusMode ? "Focus" : "Break";
            
            const duration = isFocusMode ? focusInput.value : breakInput.value;
            timeLeft = duration * 60;
            updateDisplay();
        }

        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            stopBinaural();

            toggleBtn.textContent = "Start";
            toggleBtn.classList.add('primary');
            const duration = isFocusMode ? focusInput.value : breakInput.value;
            timeLeft = duration * 60;
            updateDisplay();
        }

        function updateSettings() {
            if (!isRunning) resetTimer();
        }

        // --- Audio Logic (Alpha Waves) ---
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleMusicPrefs() {
            musicEnabled = !musicEnabled;
            renderMusicButton();
            
            if (isRunning && isFocusMode) {
                if (musicEnabled) startBinaural();
                else stopBinaural();
            }
        }

        function renderMusicButton() {
            musicToggleBtn.innerHTML = musicEnabled ? ICON_VOL_ON : ICON_VOL_OFF;
            musicToggleBtn.style.color = musicEnabled ? 'var(--text-primary)' : 'var(--text-secondary)';
        }

        // Generates 10Hz Alpha Beat (140Hz Left, 150Hz Right)
        function startBinaural() {
            if (!audioCtx) initAudio();
            if (leftOsc) stopBinaural();

            const baseFreq = 140; // Left Ear
            const beatFreq = 10;  // 10Hz Beat

            // Gain Node (Volume)
            gainNode = audioCtx.createGain();
            gainNode.gain.value = 0.05; // 5% volume
            gainNode.connect(audioCtx.destination);

            // Left Ear
            const pannerLeft = audioCtx.createStereoPanner();
            pannerLeft.pan.value = -1;
            pannerLeft.connect(gainNode);
            
            leftOsc = audioCtx.createOscillator();
            leftOsc.type = 'sine';
            leftOsc.frequency.value = baseFreq;
            leftOsc.connect(pannerLeft);
            leftOsc.start();

            // Right Ear
            const pannerRight = audioCtx.createStereoPanner();
            pannerRight.pan.value = 1;
            pannerRight.connect(gainNode);

            rightOsc = audioCtx.createOscillator();
            rightOsc.type = 'sine';
            rightOsc.frequency.value = baseFreq + beatFreq; // 150 Hz
            rightOsc.connect(pannerRight);
            rightOsc.start();
        }

        function stopBinaural() {
            if (leftOsc) {
                try {
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                    setTimeout(() => {
                        leftOsc.stop();
                        rightOsc.stop();
                        leftOsc = null;
                        rightOsc = null;
                    }, 100);
                } catch(e) {}
            }
        }

        function playNotificationSound() {
            const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
            audio.volume = 0.6;
            audio.play().catch(e => console.log("Audio blocked or failed"));
        }

        // --- Heatmap Logic ---
        function logMinute() {
            const today = new Date().toISOString().split('T')[0];
            if (!studyData[today]) studyData[today] = 0;
            studyData[today] += 1;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(studyData));
            renderHeatmap();
        }

        function renderHeatmap() {
            const container = document.getElementById('heatmap');
            const monthsContainer = document.getElementById('months-labels');
            
            container.innerHTML = '';
            monthsContainer.innerHTML = '';
            
            const today = new Date();
            const oneYearAgo = new Date();
            oneYearAgo.setDate(today.getDate() - 365);

            let dayIndex = 0;
            
            for (let d = new Date(oneYearAgo); d <= today; d.setDate(d.getDate() + 1)) {
                const dateStr = d.toISOString().split('T')[0];
                const minutes = studyData[dateStr] || 0;
                
                if (d.getDate() === 1 && dayIndex > 7) {
                    const label = document.createElement('div');
                    label.className = 'month-label';
                    label.textContent = d.toLocaleString('default', { month: 'short' });
                    const colIndex = Math.floor(dayIndex / 7);
                    label.style.left = `${colIndex * 14}px`;
                    monthsContainer.appendChild(label);
                }

                const cell = document.createElement('div');
                cell.className = 'day-cell';
                if (minutes > 0) cell.classList.add('level-1');
                if (minutes > 30) cell.classList.add('level-2');
                if (minutes > 60) cell.classList.add('level-3');
                if (minutes > 120) cell.classList.add('level-4');
                
                cell.onmouseover = () => {
                    document.getElementById('tooltip').textContent = `${dateStr}: ${minutes} mins`;
                };
                
                container.appendChild(cell);
                dayIndex++;
            }
        }

        renderHeatmap();
        renderMusicButton();
    </script>
</body>
</html>
