<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Focus</title>
    <link id="dynamic-favicon" rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚫</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #101010;
            --surface-color: #202020;
            --text-primary: #ffffff;
            --text-secondary: #8a8a8a;
            --accent-color: #e0e0e0;
            --timer-color: #AFAFAF;
            --grid-empty: #1a1a1a;
            --level-1: #0e4429; 
            --level-2: #006d32;
            --level-3: #26a641;
            --level-4: #39d353;
            --danger-color: #ff4d4d;
            --success-color: #39d353;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: "Inter", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            
            /* Cinematic Fade In */
            opacity: 0;
            animation: zenFadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes zenFadeIn {
            0% { opacity: 0; filter: blur(10px); transform: scale(0.98); }
            100% { opacity: 1; filter: blur(0); transform: scale(1); }
        }

        /* Top Bar Layout */
        .top-bar {
            position: absolute;
            top: 25px;
            right: 25px;
            display: flex;
            align-items: center;
            gap: 12px; 
            z-index: 100;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px; 
            width: 40px;  
        }
        .icon-btn:hover { color: var(--text-primary); background: var(--surface-color); }
        .icon-btn svg { width: 24px; height: 24px; fill: currentColor; }

        /* Profile Container */
        .profile-container { 
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;
        }
        
        .profile-pic {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            background-color: var(--surface-color);
            border: 2px solid transparent;
            transition: border-color 0.2s;
            object-fit: cover;
            display: block; 
        }
        .profile-pic:hover { border-color: var(--text-secondary); }
        
        /* Dropdown Menu */
        .profile-menu {
            position: absolute;
            top: 50px;
            right: 0;
            background-color: var(--surface-color);
            border-radius: 12px;
            padding: 12px;
            width: 200px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            gap: 8px;
            border: 1px solid #333;
            z-index: 101;
        }
        .profile-menu.visible { display: flex; animation: fadeIn 0.1s ease-out; }

        .menu-status {
            font-size: 0.85rem;
            color: var(--text-secondary);
            padding: 4px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        .sync-dot { width: 8px; height: 8px; border-radius: 50%; }
        .sync-dot.green { background-color: var(--success-color); }
        .sync-dot.grey { background-color: var(--text-secondary); }
        
        .menu-btn {
            background: transparent;
            color: var(--text-primary);
            border: none;
            text-align: left;
            padding: 8px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .menu-btn:hover { background-color: #333; }
        .menu-btn.logout { color: var(--danger-color); }
        .menu-btn.login { color: var(--text-primary); font-weight: 600; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* Timer Section */
        .timer-container { text-align: center; margin-bottom: 30px; width: 100%; }

        .time-display {
            font-size: 7rem;
            font-weight: 600;
            letter-spacing: -0.04em;
            line-height: 1;
            margin-top: 10px;
            margin-bottom: 40px;
            font-variant-numeric: tabular-nums;
            color: var(--timer-color);
        }

        .status-badge {
            background-color: var(--surface-color);
            color: var(--text-secondary);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 500;
            display: inline-block;
        }

        /* Controls */
        .controls { display: flex; gap: 12px; justify-content: center; margin-bottom: 30px; }

        button.control-btn {
            background-color: var(--surface-color);
            color: var(--text-primary);
            border: none;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button.control-btn:hover { background-color: #333333; transform: translateY(-1px); }
        
        button.primary { 
            background-color: var(--timer-color); 
            color: var(--bg-color); 
            font-weight: 600; 
        }
        button.primary:hover { background-color: #ffffff; opacity: 1; }

        /* Settings */
        .settings {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .settings label { display: flex; align-items: center; gap: 8px; }
        input {
            background: var(--surface-color);
            border: none;
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 8px;
            width: 40px;
            text-align: center;
            font-family: inherit;
            font-weight: 600;
            font-size: 1rem;
        }
        input:focus { outline: 2px solid var(--accent-color); }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        /* Heatmap */
        .heatmap-container {
            background-color: var(--surface-color);
            padding: 24px;
            padding-bottom: 12px; 
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 90vw;
        }

        .heatmap-scroll-area {
            width: 100%;
            overflow-x: auto;
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }

        .heatmap-wrapper { display: flex; flex-direction: column; align-items: flex-start; }
        .months-container { position: relative; height: 15px; width: 100%; margin-bottom: 4px; }
        .month-label { position: absolute; font-size: 10px; color: var(--text-secondary); white-space: nowrap; }
        .heatmap-grid { display: grid; grid-template-rows: repeat(7, 10px); grid-auto-flow: column; gap: 4px; }
        .day-cell { width: 10px; height: 10px; border-radius: 2px; background-color: var(--grid-empty); flex-shrink: 0; }
        
        .level-1 { background-color: var(--level-1); }
        .level-2 { background-color: var(--level-2); }
        .level-3 { background-color: var(--level-3); }
        .level-4 { background-color: var(--level-4); }

        .tooltip { 
            font-size: 0.85rem; 
            color: var(--text-secondary); 
            height: 1em; 
            font-weight: 500; 
            min-height: 1.2em; 
            text-align: center;
        }

        @media (max-width: 600px) {
            .time-display { font-size: 20vw; margin-bottom: 30px; }
            .controls { gap: 8px; }
            button.control-btn { padding: 12px 20px; font-size: 0.95rem; }
            .top-bar { top: 15px; right: 15px; }
            .heatmap-container { width: 95vw; padding: 16px; }
            .heatmap-scroll-area { justify-content: flex-start; }
            .heatmap-wrapper { padding-left: 4px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="icon-btn" id="music-toggle" onclick="toggleMusicPrefs()" title="Toggle Alpha Waves">
            </button>

        <div class="profile-container">
            <button class="icon-btn" id="login-icon" onclick="toggleMenu()" title="Account">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </button>
            <img id="profile-pic" class="profile-pic" src="" style="display: none;" onclick="toggleMenu()" alt="Profile">
            
            <div class="profile-menu" id="profile-menu">
                </div>
        </div>
    </div>

    <div class="timer-container">
        <div class="status-badge" id="status-text">Focus</div>
        <div class="time-display" id="timer">25:00</div>
        
        <div class="controls">
            <button class="control-btn" onclick="resetTimer()">Reset</button>
            <button class="control-btn primary" onclick="toggleTimer()" id="toggle-btn">Start</button>
            <button class="control-btn" onclick="switchMode()">Skip</button>
        </div>

        <div class="settings">
            <label>Focus <input type="number" id="focus-input" value="25" onchange="updateSettings()"></label>
            <label>Break <input type="number" id="break-input" value="5" onchange="updateSettings()"></label>
        </div>
    </div>

    <div class="heatmap-container">
        <div class="heatmap-scroll-area">
            <div class="heatmap-wrapper">
                <div class="months-container" id="months-labels"></div>
                <div class="heatmap-grid" id="heatmap"></div>
            </div>
        </div>
        <div class="tooltip" id="tooltip">Total study time today: 0m</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- PASTE YOUR FIREBASE CONFIG HERE ---
        const firebaseConfig = {
            apiKey: "AIzaSyBB6ioY-lyDEO1BBG6FzHhWR9mXg7RXHIg",
            authDomain: "adi-7z-focus.firebaseapp.com",
            projectId: "adi-7z-focus",
            storageBucket: "adi-7z-focus.firebasestorage.app",
            messagingSenderId: "976912152618",
            appId: "1:976912152618:web:6ea0a224470c7e672b6b53",
            measurementId: "G-F6DEKG8WJW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        
        const loginIcon = document.getElementById('login-icon');
        const profilePic = document.getElementById('profile-pic');
        const profileMenu = document.getElementById('profile-menu');

        function renderMenuState() {
            if (currentUser) {
                profileMenu.innerHTML = `
                    <div class="menu-status"><div class="sync-dot green"></div> Syncing</div>
                    <div class="menu-status" style="color: var(--text-primary); padding-top:0;">${currentUser.email}</div>
                    <hr style="border: 0; border-top: 1px solid #333; width: 100%; margin: 4px 0;">
                    <button class="menu-btn logout" onclick="handleLogout()">Log Out</button>
                `;
                loginIcon.style.display = 'none';
                profilePic.style.display = 'block';
                profilePic.src = currentUser.photoURL || 'https://via.placeholder.com/36';
            } else {
                profileMenu.innerHTML = `
                    <div class="menu-status"><div class="sync-dot grey"></div> Not syncing</div>
                    <hr style="border: 0; border-top: 1px solid #333; width: 100%; margin: 4px 0;">
                    <button class="menu-btn login" onclick="handleAuth()">Log In with Google</button>
                `;
                loginIcon.style.display = 'block';
                profilePic.style.display = 'none';
            }
        }

        window.handleAuth = async () => {
            profileMenu.classList.remove('visible');
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login failed", error);
            }
        };

        window.handleLogout = async () => {
            profileMenu.classList.remove('visible');
            await signOut(auth);
            localStorage.removeItem(STORAGE_KEY);
            studyData = {}; 
            renderHeatmap(); 
            updateTodayTotal(); 
        };

        window.toggleMenu = () => {
            profileMenu.classList.toggle('visible');
        };

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.profile-container')) {
                profileMenu.classList.remove('visible');
            }
        });

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            renderMenuState();
            if (user) await loadCloudData();
        });

        const STORAGE_KEY = 'study_heatmap_data';
        let studyData = {}; 

        function loadLocalData() {
            studyData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
            renderHeatmap();
            updateTodayTotal();
        }

        async function loadCloudData() {
            if (!currentUser) return;
            const userRef = doc(db, "users", currentUser.uid);
            const docSnap = await getDoc(userRef);
            
            if (docSnap.exists()) {
                studyData = docSnap.data().heatmap || {};
                localStorage.setItem(STORAGE_KEY, JSON.stringify(studyData));
                renderHeatmap();
                updateTodayTotal();
            } else {
                await setDoc(userRef, { heatmap: studyData }, { merge: true });
            }
        }

        async function saveProgress(dateStr) {
            if (!studyData[dateStr]) studyData[dateStr] = 0;
            studyData[dateStr] += 1;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(studyData));
            updateTodayTotal();

            if (currentUser) {
                const userRef = doc(db, "users", currentUser.uid);
                await updateDoc(userRef, {
                    [`heatmap.${dateStr}`]: increment(1)
                });
            }
        }

        function updateTodayTotal() {
            const today = new Date().toISOString().split('T')[0];
            const mins = studyData[today] || 0;
            document.getElementById('tooltip').textContent = `Total study time today: ${mins}m`;
        }

        window.logMinuteExternally = () => {
            const today = new Date().toISOString().split('T')[0];
            saveProgress(today);
            renderHeatmap();
        }
        window.getStudyData = () => studyData;
        window.updateTodayTotal = updateTodayTotal;

        loadLocalData();
        renderMenuState();
    </script>

    <script>
        // --- TIMER & UI LOGIC ---
        
        let timeLeft = 25 * 60;
        let isRunning = false;
        let isFocusMode = true;
        let timerId = null;
        let musicEnabled = false; 
        
        let audioCtx;
        let leftOsc, rightOsc, gainNode;
        
        const timerDisplay = document.getElementById('timer');
        const statusText = document.getElementById('status-text');
        const toggleBtn = document.getElementById('toggle-btn');
        const focusInput = document.getElementById('focus-input');
        const breakInput = document.getElementById('break-input');
        const musicToggleBtn = document.getElementById('music-toggle');
        const faviconLink = document.getElementById('dynamic-favicon');

        // ICONS
        const ICON_VOL_ON = `<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`;
        const ICON_VOL_OFF = `<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>`;

        // SVG STRINGS FOR FAVICON (White Stroke)
        const CLOCK_SVG = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' stroke='white' stroke-width='8' fill='none'/%3E%3Cpath d='M50 25 V50 H70' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E`;
        const LEAF_SVG  = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 85 C20 85 10 50 50 15 C90 50 80 85 50 85 Z M50 25 V75' stroke='white' stroke-width='8' fill='none'/%3E%3C/svg%3E`;

        function updateDisplay() {
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');
            const timeString = `${m}:${s}`;
            timerDisplay.textContent = timeString;
            
            // Minimal Title: Just the time
            document.title = timeString;

            // Update Favicon based on mode
            if (isFocusMode) {
                faviconLink.href = CLOCK_SVG;
            } else {
                faviconLink.href = LEAF_SVG;
            }
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId);
                toggleBtn.textContent = "Start";
                toggleBtn.classList.add('primary');
                stopBinaural();
            } else {
                initAudio();
                timerId = setInterval(tick, 1000);
                toggleBtn.textContent = "Pause";
                toggleBtn.classList.remove('primary');
                if (isFocusMode && musicEnabled) startBinaural();
            }
            isRunning = !isRunning;
        }

        function tick() {
            if (timeLeft > 0) {
                timeLeft--;
                updateDisplay();
                if (isFocusMode && timeLeft % 60 === 0) {
                    if (window.logMinuteExternally) window.logMinuteExternally();
                }
            } else {
                playNotificationSound();
                switchMode();
            }
        }

        function switchMode() {
            clearInterval(timerId);
            isRunning = false;
            stopBinaural();
            toggleBtn.textContent = "Start";
            toggleBtn.classList.add('primary');
            isFocusMode = !isFocusMode;
            statusText.textContent = isFocusMode ? "Focus" : "Break";
            const duration = isFocusMode ? focusInput.value : breakInput.value;
            timeLeft = duration * 60;
            updateDisplay();
        }

        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            stopBinaural();
            toggleBtn.textContent = "Start";
            toggleBtn.classList.add('primary');
            const duration = isFocusMode ? focusInput.value : breakInput.value;
            timeLeft = duration * 60;
            updateDisplay();
        }

        function updateSettings() {
            if (!isRunning) resetTimer();
        }

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function toggleMusicPrefs() {
            musicEnabled = !musicEnabled;
            renderMusicButton();
            if (isRunning && isFocusMode) {
                if (musicEnabled) startBinaural();
                else stopBinaural();
            }
        }

        function renderMusicButton() {
            musicToggleBtn.innerHTML = musicEnabled ? ICON_VOL_ON : ICON_VOL_OFF;
            musicToggleBtn.style.color = musicEnabled ? 'var(--text-primary)' : 'var(--text-secondary)';
        }

        function startBinaural() {
            if (!audioCtx) initAudio();
            if (leftOsc) stopBinaural();
            const baseFreq = 140; 
            const beatFreq = 10; 

            gainNode = audioCtx.createGain();
            gainNode.gain.value = 0.05; 
            gainNode.connect(audioCtx.destination);

            const pannerLeft = audioCtx.createStereoPanner();
            pannerLeft.pan.value = -1;
            pannerLeft.connect(gainNode);
            leftOsc = audioCtx.createOscillator();
            leftOsc.type = 'sine';
            leftOsc.frequency.value = baseFreq;
            leftOsc.connect(pannerLeft);
            leftOsc.start();

            const pannerRight = audioCtx.createStereoPanner();
            pannerRight.pan.value = 1;
            pannerRight.connect(gainNode);
            rightOsc = audioCtx.createOscillator();
            rightOsc.type = 'sine';
            rightOsc.frequency.value = baseFreq + beatFreq; 
            rightOsc.connect(pannerRight);
            rightOsc.start();
        }

        function stopBinaural() {
            if (leftOsc) {
                try {
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                    setTimeout(() => {
                        leftOsc.stop(); rightOsc.stop();
                        leftOsc = null; rightOsc = null;
                    }, 100);
                } catch(e) {}
            }
        }

        function playNotificationSound() {
            // Gentle Zen Bell
            const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/1110/1110-preview.mp3');
            audio.volume = 0.6;
            audio.play().catch(e => console.log("Audio fail"));
        }

        function renderHeatmap() {
            const container = document.getElementById('heatmap');
            const monthsContainer = document.getElementById('months-labels');
            const tooltip = document.getElementById('tooltip');
            
            container.innerHTML = '';
            monthsContainer.innerHTML = '';
            
            const data = window.getStudyData ? window.getStudyData() : {};

            const today = new Date();
            const oneYearAgo = new Date();
            oneYearAgo.setDate(today.getDate() - 365);
            let dayIndex = 0;
            
            for (let d = new Date(oneYearAgo); d <= today; d.setDate(d.getDate() + 1)) {
                const dateStr = d.toISOString().split('T')[0];
                const minutes = data[dateStr] || 0;
                
                if (d.getDate() === 1 && dayIndex > 7) {
                    const label = document.createElement('div');
                    label.className = 'month-label';
                    label.textContent = d.toLocaleString('en-US', { month: 'short' });
                    const colIndex = Math.floor(dayIndex / 7);
                    label.style.left = `${colIndex * 14}px`;
                    monthsContainer.appendChild(label);
                }

                const cell = document.createElement('div');
                cell.className = 'day-cell';
                if (minutes > 0) cell.classList.add('level-1');
                if (minutes > 30) cell.classList.add('level-2');
                if (minutes > 60) cell.classList.add('level-3');
                if (minutes > 120) cell.classList.add('level-4');
                
                const monthShort = d.toLocaleString('en-US', { month: 'short' });
                const dayNum = d.getDate();
                const hoverText = `${monthShort}. ${dayNum} - ${minutes} min`;

                cell.onmouseover = () => {
                    tooltip.textContent = hoverText;
                    tooltip.style.color = "var(--text-primary)";
                };
                
                cell.onmouseleave = () => {
                    if (window.updateTodayTotal) window.updateTodayTotal();
                    tooltip.style.color = "var(--text-secondary)";
                };
                
                container.appendChild(cell);
                dayIndex++;
            }
        }

        setTimeout(() => {
            if(window.updateTodayTotal) window.updateTodayTotal();
        }, 100);

        renderHeatmap();
        renderMusicButton();
        updateDisplay(); // Set initial Title/Favicon
    </script>
</body>
</html>
